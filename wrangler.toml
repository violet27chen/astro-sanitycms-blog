# Cloudflare Workers + Assets deployment config (Astro static output)
# `astro build` emits static assets into ./dist/client (generated wrangler.json lives there too).
# `wrangler deploy` from the project root uses THIS file.

name = "violet27chen"
compatibility_date = "2026-04-15"
compatibility_flags = []

# Static assets produced by `astro build` (no custom worker script -> Cloudflare serves them directly)
assets = { directory = "./dist/client" }

# Auto-provisioned on first deploy (free KV namespace). Used by Astro sessions.
# Harmless for a static site; keeps the adapter's expected binding in place.
kv_namespaces = [
  { binding = "SESSION" }
]
